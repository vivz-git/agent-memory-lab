name: CI Pipeline

"on":
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint-and-test:
    name: Lint & Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run code formatting & linter checks
        run: |
          ruff check .
          ruff format --check .

      - name: Run pytest test suite with coverage
        run: |
          pytest tests/ -v --cov=scripts --cov-report=term --cov-report=xml

      - name: Verify CLI Reproduction Entrypoint
        run: |
          python scripts/run_reproduction.py --help
          python scripts/run_reproduction.py --protocol A --dry-run
          python scripts/run_reproduction.py --protocol B --dry-run
          python scripts/run_reproduction.py --protocol C --dry-run
          python scripts/run_reproduction.py --protocol D --dry-run
          python scripts/run_reproduction.py --protocol all --dry-run

  docker-build:
    name: Docker Build Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: agent-memory-benchmark:ci-test
